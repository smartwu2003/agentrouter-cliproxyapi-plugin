# Minimal snippet to enable the AgentRouter plugin.
plugins:
  enabled: true
  dir: "plugins"
  configs:
    agentrouter:
      enabled: true
      priority: 10
      base_url: "https://ps.air-outer.com"
      api_key: "sk-replace-me"
      user_agent: "claude-cli/2.1.161 (external, cli)"
      auto_discover_models: true
      # The dashboard stores these after an account authorization:
      # account_token: ""
      # user_id: ""
      # dashboard_base_url: "https://ps.air-outer.com"
      # proxy_url: "http://127.0.0.1:7890"
      username: ""
      password: ""
      checkin_on_startup: false
      checkin_hour: 9
